name: Database Migration Checks

on:
  push:
    branches: [main, develop]
    paths:
      - 'migrations/**'
      - 'scripts/migrate.ts'
  pull_request:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'scripts/migrate.ts'

jobs:
  lint-migrations:
    name: Lint Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint migrations
        run: npx ts-node scripts/migrate.ts lint

  test-migrations:
    name: Test Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run migration tests
        run: npm test -- migration.test.ts
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

  dry-run-migrations:
    name: Dry Run Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Dry run migrations
        run: npx ts-node scripts/migrate.ts dry-run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

  deploy-gate:
    name: Deployment Gate
    needs: [lint-migrations, test-migrations, dry-run-migrations]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check if migrations pass
        run: echo "All migration checks passed - deployment allowed"
